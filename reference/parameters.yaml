# Parameters of the reference model: generic component data, mission time,
# human error probabilities. Every value is shared by the events that
# reference it, so a sensitivity study changes one line and a Monte Carlo
# run samples it once per iteration (state-of-knowledge correlation).
#
# The data set is illustrative. See reference/README.md.
parameters:

  PAR-MISSION-24H:
    label: "Mission time, 24 h"
    value: 24.0
    unit: hour
    provenance:
      source: "Model construction (success criteria of this reference model)"
      justification: >-
        24 h stabilisation assumed for every front-line system of this model.

  PAR-MDP-FTS:
    label: "Motor-driven pump fails to start on demand"
    value: 1.2e-3
    unit: per_demand
    uncertainty:
      distribution: lognormal
      error_factor: 5.0
    provenance:
      source: >-
        Generic PWR component data; order of magnitude of the industry-average estimates
        published in NUREG/CR-6928 and the NRC CCF database
      justification: >-
        Standby motor-driven pump, start on demand. Illustrative reference value, not
        transcribed from a specific table; see reference/README.md on the status of this
        data set.

  PAR-MDP-FTR:
    label: "Motor-driven pump fails to run"
    value: 3.0e-5
    unit: per_hour
    uncertainty:
      distribution: lognormal
      error_factor: 5.0
    provenance:
      source: >-
        Generic PWR component data; order of magnitude of the industry-average estimates
        published in NUREG/CR-6928 and the NRC CCF database
      justification: >-
        Standby motor-driven pump, run after a successful start. Illustrative reference
        value, not transcribed from a specific table; see reference/README.md on the
        status of this data set.

  PAR-TDP-FTS:
    label: "Turbine-driven pump fails to start on demand"
    value: 0.013
    unit: per_demand
    uncertainty:
      distribution: lognormal
      error_factor: 5.0
    provenance:
      source: >-
        Generic PWR component data; order of magnitude of the industry-average estimates
        published in NUREG/CR-6928 and the NRC CCF database
      justification: >-
        Steam-driven auxiliary feedwater pump, start on demand. Illustrative reference
        value, not transcribed from a specific table; see reference/README.md on the
        status of this data set.

  PAR-TDP-FTR:
    label: "Turbine-driven pump fails to run"
    value: 1.0e-4
    unit: per_hour
    uncertainty:
      distribution: lognormal
      error_factor: 5.0
    provenance:
      source: >-
        Generic PWR component data; order of magnitude of the industry-average estimates
        published in NUREG/CR-6928 and the NRC CCF database
      justification: >-
        Steam-driven auxiliary feedwater pump, run after a successful start.
        Illustrative reference value, not transcribed from a specific table; see
        reference/README.md on the status of this data set.

  PAR-EDG-FTS:
    label: "Emergency diesel generator fails to start"
    value: 4.0e-3
    unit: per_demand
    uncertainty:
      distribution: lognormal
      error_factor: 4.0
    provenance:
      source: >-
        Generic PWR component data; order of magnitude of the industry-average estimates
        published in NUREG/CR-6928 and the NRC CCF database
      justification: >-
        Start and load within the required time. Illustrative reference value, not
        transcribed from a specific table; see reference/README.md on the status of this
        data set.

  PAR-EDG-FTR:
    label: "Emergency diesel generator fails to run"
    value: 8.0e-4
    unit: per_hour
    uncertainty:
      distribution: lognormal
      error_factor: 5.0
    provenance:
      source: >-
        Generic PWR component data; order of magnitude of the industry-average estimates
        published in NUREG/CR-6928 and the NRC CCF database
      justification: >-
        Run loaded after a successful start. Illustrative reference value, not
