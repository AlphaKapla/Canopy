name: PSA model CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema
      - name: Validate model (schema + reference lint)
        run: python ci/validate.py model schema/psa-model.schema.json
      - name: Validator regression suite (mutation cases + partition lint vs brute force)
        run: python ci/test_validate.py

  # NFR-1 guard: the stated minimum toolchain (Rust 1.75, matching the
  # committed lockfile format v3) builds the engine and passes its tests,
  # and its binary produces results bit-identical to the latest stable's
  # on the demo model, Monte Carlo included.
  toolchains:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema
      - uses: dtolnay/rust-toolchain@1.75.0
      - name: Engine tests on Rust 1.75
        run: |
          cargo test --release --manifest-path engine/Cargo.toml
          cargo build --release --manifest-path engine/Cargo.toml
          cp engine/target/release/canopy /tmp/canopy-1.75
          git diff --exit-code engine/Cargo.lock
      - uses: dtolnay/rust-toolchain@stable
      - name: Same results from Rust stable
        run: |
          cargo build --release --manifest-path engine/Cargo.toml
          git diff --exit-code engine/Cargo.lock
          CANOPY_BIN=/tmp/canopy-1.75 python ci/quantify.py model old.json --samples 10000 --seed 20260708
          python ci/quantify.py model new.json --samples 10000 --seed 20260708
          cmp old.json new.json
          for t in FT-ECCS-INJECTION FT-RHR FT-RPS; do
            cmp <(/tmp/canopy-1.75 model $t --json --samples 2000 --keep-samples) \
                <(engine/target/release/canopy model $t --json --samples 2000 --keep-samples)
          done
          echo "Rust 1.75 and stable: bit-identical results"

  quantify:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # need base commit for the delta

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            engine/target
          key: cargo-${{ runner.os }}-${{ hashFiles('engine/Cargo.lock') }}

      - name: Build quantification engine
        run: cargo build --release --manifest-path engine/Cargo.toml

      - name: Property-based validation (engine vs brute-force oracle)
        run: python ci/property_test.py --cases 60 --seed 20260708

      - name: Tooling tests (consequence report, importance, RiskSpectrum import round trip)
        run: |
          python ci/test_consequence_report.py
          python ci/test_importance.py
          python ci/test_transfers.py
          python ci/test_units.py
          python ci/test_cli.py
          python ci/test_sampling.py
          python ci/test_import_riskspectrum.py

      # Point values plus a Monte Carlo propagation of parameter uncertainty.
      # Same N and seed on both sides: the engine keys its random numbers by
      # (seed, quantity ID, iteration), so base and head share samples for
      # every unchanged quantity and compare.py can report the paired
      # change band (docs/quantification.md).
      - name: Quantify head
        run: python ci/quantify.py model head.json --samples 10000 --seed 20260708

      - name: Quantify base
        if: github.event_name == 'pull_request'
        run: |
          git worktree add /tmp/base ${{ github.event.pull_request.base.sha }}
          # Engine binary from head is used for both sides: the model is
          # what's being diffed, not the engine. (If the PR changes the
          # engine itself, results are computed with the NEW engine for
          # both, which is the comparison you want.)
          python ci/quantify.py /tmp/base/model base.json --samples 10000 --seed 20260708

      - name: Compute risk delta
        if: github.event_name == 'pull_request'
        run: python ci/compare.py base.json head.json > delta.md

      - name: Upload quantification results
        uses: actions/upload-artifact@v5
        with:
          name: quantification-results
          path: |
            head.json
            base.json
            delta.md
          if-no-files-found: ignore

      - name: Post or update PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('delta.md', 'utf8');
            const marker = '<!-- psa-delta -->';
            const {data: comments} = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const prev = comments.find(c => c.body.includes(marker));
            if (prev) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: prev.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
