# Independent cross-verification against SCRAM (manual: SCRAM is built
# from source, ~5 min). Run before tagging a model revision or after
# engine changes.
name: SCRAM cross-verification
on:
  workflow_dispatch:
    inputs:
      cases:
        description: "Number of generated models"
        default: "100"
      aralia:
        description: "Also run the Aralia benchmark (both engines, long)"
        default: "true"

jobs:
  crosscheck:
    # Pinned: SCRAM (commit b85b789, 2018) no longer builds on the Ubuntu 26
    # image that ubuntu-latest moved to on 19 Oct 2026 (V&V F-11). A
    # reference engine must be built the same way each time.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install pyyaml jsonschema
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --manifest-path engine/Cargo.toml

      - name: Build SCRAM from source
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q cmake libxml2-dev libboost-dev \
            libboost-program-options-dev libboost-filesystem-dev \
            libboost-random-dev libboost-math-dev libboost-date-time-dev \
            libboost-exception-dev
          git clone https://github.com/rakhimov/scram /tmp/scram
          git -C /tmp/scram checkout b85b78940de38996eeffec54d946824bd4280a1c
          # One-line fix for boost >= 1.73 (macro removed upstream):
          sed -i 's/BOOST_THROW_EXCEPTION_CURRENT_FUNCTION/BOOST_CURRENT_FUNCTION/' \
            /tmp/scram/src/error.h
          sed -i 's|#include "ext/source_info.h"|#include <boost/current_function.hpp>\n#include "ext/source_info.h"|' \
            /tmp/scram/src/error.h
          cmake -S /tmp/scram -B /tmp/scram/build \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_GUI=OFF -DBUILD_TESTS=OFF
          make -C /tmp/scram/build -j$(nproc)
          sudo make -C /tmp/scram/build install

      - name: Cross-check (demo + generated models)
        run: |
          set -o pipefail
          python ci/crosscheck_scram.py --cases ${{ inputs.cases }} | tee /tmp/crosscheck.txt

      - name: Aralia benchmark (both engines; P(top) and importance)
        if: ${{ inputs.aralia == 'true' }}
        run: |
          set -o pipefail
          PSA_BENCH_MEM_GIB=4 python ci/benchmark_mef.py \
            /tmp/scram/input/Aralia --timeout 120 --importance --primes 3 \
            --primes-timeout 900 | tee /tmp/aralia.txt

      # The figures the V&V report quotes (§5.4, §5.5), as run annotations,
      # readable through the API without the job log
      - name: Results as annotations
        if: ${{ always() }}
        run: |
          if [ -f /tmp/crosscheck.txt ]; then
            echo "::notice title=cross-check sequences::$(grep -c '^ok .*sequences compared' /tmp/crosscheck.txt) cases agree, $(grep -c '^FAIL' /tmp/crosscheck.txt) fail, $(grep -o '[0-9]* sequences compared' /tmp/crosscheck.txt | awk '{s+=$1} END {print s}') sequences"
            sed -n '/^prime implicants:/,$p' /tmp/crosscheck.txt | grep . | while IFS= read -r l; do echo "::notice title=cross-check::$l"; done
          fi
          if [ -f /tmp/aralia.txt ]; then
            sed -n '/ agree, .* disagree, /,$p' /tmp/aralia.txt | grep . | while IFS= read -r l; do echo "::notice title=Aralia::$l"; done
          fi
