# Component types of the reference model: each failure mode's data stated once.
# Authoring aid only -- the model is the flat YAML under reference/, generated
# from these by `python ci/canopy.py expand reference --templates
# reference-templates` and checked in CI (docs/model-format.md).
#
# Every value is a reference to a parameter, so the data lives in one place
# (reference/parameters.yaml) and a component type only says which failure
# model applies to which mode.
component_types:

  CT-MDP:
    label: "Motor-driven pump, standby"

    failure_modes:

      FTS:
        label: "fails to start on demand"
        failure_model:
          type: probability
          value: {param: PAR-MDP-FTS}
        provenance:
          source: "Generic parameter PAR-MDP-FTS"
          justification: >-
            Shared by every motor-driven pump of this model; the value and its basis are
            stated once, on PAR-MDP-FTS.

      FTR:
        label: "fails to run for the 24 h mission"
        failure_model:
          type: rate-mission
          rate: {param: PAR-MDP-FTR}
          mission_time: {param: PAR-MISSION-24H}
        provenance:
          source: "Generic parameter PAR-MDP-FTR"
          justification: >-
            Shared by every motor-driven pump of this model; the value and its basis are
            stated once, on PAR-MDP-FTR.

      TM:
        label: "train unavailable for test or maintenance"
        failure_model:
          type: probability
          value: {param: PAR-TM-TRAIN}
        provenance:
          source: "Generic parameter PAR-TM-TRAIN"
          justification: >-
            Shared by every standby train of this model; the value and its basis are
            stated once, on PAR-TM-TRAIN.

