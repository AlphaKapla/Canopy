  AFW-MOV-B:
    type: CT-MOV
    label: "Auxiliary feedwater discharge valve B"
    system: AFW
    component: MOV-B

  AFW-MOV-T:
    type: CT-MOV
    label: "Auxiliary feedwater discharge valve T"
    system: AFW
