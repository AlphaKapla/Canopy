output: basic-events/aux-feedwater.yaml
header: "Auxiliary feedwater: two motor-driven trains and one turbine-driven train,\nall taking suction from the condensate storage tank. The turbine-driven\ntrain needs no AC power, which is what carries the station-blackout\nsequences of the loss-of-offsite-power tree.\n"

